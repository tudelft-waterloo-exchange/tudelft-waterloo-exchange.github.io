<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Name</title>
  <meta name="description" content="Links to everything I'm working on.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <img class="avatar" id="avatar" alt="" hidden>
    <h1 id="name"></h1>
    <p class="bio" id="bio"></p>
    <ul id="links"></ul>
    <p class="bio" id="error" hidden>Couldn't load links.json</p>
    <footer id="footer"></footer>
  </main>
  <script>
    fetch("links.json", { cache: "no-cache"})
      .then(res => {
        if (!res.ok) {
          throw new Error(res.status);
        }
        return res.json();
      })
      .then(data => {
        const name = data.name || "";
        document.title = name;
        document.getElementById("name").textContent = name;
        document.getElementById("bio").textContent = data.bio || "";
        document.getElementById("footer").textContent = name ? "\u00a9 " + name : "";

        if (data.avatar) {
          const img = document.getElementById("avatar")
          img.src = data.avatar;
          img.hidden = false;
          img.onerror = () => { img.hidden = true; };
        }

        const list = document.getElementById("links");
        (data.links || []).forEach(item => {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.className = "link";
          a.href = item.url;
          a.textContent = item.title;

          if (/^https?:/.test(item.url)) { a.target = "_blank"; a.rel = "noopener";}
          if (item.description) {
            const small = document.createElement("small");
            small.textContent = item.description;
            a.appendChild(small);
          }
          li.appendChild(a);
          list.appendChild(li);
        });
      })
      .catch(() => { document.getElementById("error").hidden = false; })
  </script>
</body>
</html>
